<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gameWrapper">
    <div id="selectScreen">
        <h2>Choose Your Dinosaur</h2>
        <p>Pick a dino to set your running style.</p>
        <div id="dinoOptions">
            <button class="dinoOption" data-dino="trex">
                <span class="dinoName">T-Rex</span>
                <span class="dinoDesc">Classic run &amp; jump</span>
            </button>
            <button class="dinoOption" data-dino="pterodactyl">
                <span class="dinoName">Pterodactyl</span>
                <span class="dinoDesc">Fly &amp; dodge flying foes</span>
            </button>
            <button class="dinoOption" data-dino="stegosaurus">
                <span class="dinoName">Stegosaurus</span>
                <span class="dinoDesc">Slow &amp; eat cacti for points</span>
            </button>
        </div>
    </div>
    <div id="scoreBoard">SCORE: 0</div>
    <div id="message" class="hidden">
        <h1>GAME OVER</h1>
        <p>Press SPACE or UP to restart</p>
        <button id="switchDino" type="button">Switch Dino</button>
    </div>
    <aside id="leaderboard">
        <h2>Top 5</h2>
        <div id="nameBox">
            <label for="playerName">Name</label>
            <input id="playerName" type="text" maxlength="8" autocomplete="off" spellcheck="false" placeholder="8 chars">
        </div>
        <ul id="leaderboardList">
            <li class="loading">Loading...</li>
        </ul>
    </aside>
    <canvas id="gameCanvas" width="1000" height="300"></canvas>
</div>

<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js"
    }
  }
</script>
<script type="module" defer src="script.js"></script>
</body>
</html>
